services:
  - type: web
    name: map-my-food-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: CORS_ORIGINS
        value: "https://map-my-food.vercel.app,http://localhost:5173"
      - key: DATABASE_URL
        fromDatabase:
          name: map-my-food-db
          property: connectionString

databases:
  - name: map-my-food-db
    databaseName: map_my_food
    user: map_my_food_user
    plan: free

