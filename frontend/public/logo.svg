<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="pinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#E85924" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#241A15" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Map Pin Path -->
  <path d="M50 8 C30.67 8 15 23.67 15 43 C15 65 50 92 50 92 C50 92 85 65 85 43 C85 23.67 69.33 8 50 8 Z" 
        fill="url(#pinGradient)" 
        filter="url(#shadow)" />

  <!-- Inner Circle Background -->
  <circle cx="50" cy="41" r="23" fill="#FFF8EE" />

  <!-- Food Cloche and Fork Accent in Deep Green -->
  <g transform="translate(32, 24)" fill="#138A72">
    <!-- Cloche handle -->
    <circle cx="18" cy="8" r="2.5" />
    <!-- Cloche dome -->
    <path d="M7 19 C7 12 11 9 18 9 C25 9 29 12 29 19 Z" />
    <!-- Cloche base plate -->
    <rect x="4" y="21" width="28" height="3" rx="1.5" />
    <!-- Steam waves -->
    <path d="M13 5 C12 3 13 1 12 0" stroke="#FF6B35" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M18 4 C17 2 18 0.5 17 0" stroke="#FF6B35" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M23 5 C22 3 23 1 22 0" stroke="#FF6B35" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  </g>
</svg>

